[package]
name = "kite-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Compiler pipeline orchestration for Kite"

[dependencies]
kite-span.workspace = true
kite-diag.workspace = true
kite-lexer.workspace = true
kite-ast.workspace = true
kite-parser.workspace = true
kite-resolve.workspace = true
kite-types.workspace = true
kite-hir.workspace = true
kite-mir.workspace = true
kite-codegen-kbc.workspace = true
kite-codegen-wasm.workspace = true
kite-vm.workspace = true

# The native backend can only exist where native code can run: the playground
# compiles this crate to wasm32, where Cranelift has nothing to emit for.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kite-codegen-clif.workspace = true
