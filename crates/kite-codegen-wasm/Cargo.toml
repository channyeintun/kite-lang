[package]
name = "kite-codegen-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WasmGC code generator for Kite"

[dependencies]
kite-mir.workspace = true
kite-hir.workspace = true
kite-span.workspace = true
wasm-encoder = "0.255.0"
# Not only for the tests: every module the compiler emits is validated before
# it is handed back, so a bad lowering is a diagnostic rather than a blank page.
#
# Default features off. The compiler is itself shipped as WebAssembly — the
# module `vite-plugin-kite` loads — so anything linked here is downloaded by
# everyone who builds a Kite project. The defaults add a component-model parser,
# `serde`, and SIMD support, none of which validating a WasmGC module touches.
wasmparser = { version = "0.255.0", default-features = false, features = ["std", "validate", "features"] }

[dev-dependencies]
kite-diag.workspace = true
kite-lexer.workspace = true
kite-parser.workspace = true
kite-resolve.workspace = true
kite-types.workspace = true
wasmprinter = "0.255.0"
