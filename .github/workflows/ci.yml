# What has to be true of every commit.
#
# The differential job is the one that matters: every program in the corpus is
# compiled to both backends, run on both, and the outputs compared. Two
# independent implementations that must agree is what makes codegen bugs
# findable, and it is the reason the bytecode VM exists at all.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Wasm half of the differential suite runs the compiled module.
      # Without Node it is skipped, and skipping it is exactly what must not
      # happen on CI.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --workspace --all-targets

  # No `cargo fmt --check`: the Rust here is laid out by hand, and the promise
  # this project makes about formatting is `kitec fmt`, which the job below
  # enforces on every Kite file in the tree.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Every `.kite` file in the tree is formatted, and formatting it again
  # changes nothing. A formatter nobody runs is a formatter that drifts.
  kite-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p kitec
      - name: every Kite file is formatted
        run: |
          set -e
          status=0
          for file in $(git ls-files '*.kite'); do
            ./target/release/kitec fmt --check "$file" || status=1
          done
          exit $status

  # The site's examples are compiled, so a documentation example that stops
  # working fails the build rather than sitting there wrong.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: ./site/build.sh
      - name: every example on the site compiles
        run: cargo test -p kite-driver --test site_examples

  wasm:
    name: the compiler builds for the web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p kite-playground --target wasm32-unknown-unknown
