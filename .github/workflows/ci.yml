# What has to be true of every commit.
#
# The differential job is the one that matters: every program in the corpus is
# compiled to all three backends — WasmGC, the bytecode VM and Cranelift — run
# on all three, and the outputs compared. Three independent implementations
# that must agree is what makes codegen bugs findable, and it is the reason the
# bytecode VM was built before the Wasm backend even though Wasm is the point
# of the project.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node 24 where it can be had: `--js-strings` builds a module against
          # the JS String Builtins, and an engine without them cannot
          # instantiate it — testing that path on an engine that skips it would
          # be testing nothing.
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          # Windows stays on 22. Node 24 there aborts inside libuv —
          # `!(handle->flags & UV_HANDLE_CLOSING)` in `uv_async_send` — while a
          # test's HTTP server shuts down, and it does so after the server's
          # connections have been destroyed explicitly, which is as far as this
          # side of the boundary can reach. It is Node's own shutdown path, not
          # the program's, and the builtins are covered on the other two.
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The Wasm half of the differential suite runs the compiled module.
      # Without Node it is skipped, and skipping it is exactly what must not
      # happen on CI.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The compiler as WebAssembly, which a bundler depends on instead of a
      # binary. It is a build artefact and not checked in, and the test that
      # holds it to identical output *skips* when it is absent — so building it
      # here is what makes that test mean anything.
      - run: ./packages/kite-wasm/build.sh
        shell: bash
      - run: cargo test --workspace --all-targets

  # No `cargo fmt --check`: the Rust here is laid out by hand, and the promise
  # this project makes about formatting is `kitec fmt`, which the job below
  # enforces on every Kite file in the tree.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # And again for wasm32, because that target compiles different code: the
      # native backend is gated out of `kite-driver` there, so a field only
      # Cranelift reads becomes dead. The job above cannot see it, and the
      # wasm32 job below only runs `cargo build`, which prints a warning and
      # exits 0 — so `field `types` is never read` was on every playground
      # build for as long as it took someone to ask about it.
      - run: cargo clippy -p kite-playground --target wasm32-unknown-unknown -- -D warnings

  # Every `.kite` file in the tree is formatted, and formatting it again
  # changes nothing. A formatter nobody runs is a formatter that drifts.
  kite-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p kitec
      - name: every Kite file is formatted
        run: |
          set -e
          status=0
          for file in $(git ls-files '*.kite'); do
            ./target/release/kitec fmt --check "$file" || status=1
          done
          exit $status

  # The site's examples are compiled, so a documentation example that stops
  # working fails the build rather than sitting there wrong.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: ./site/build.sh
      - name: every example on the site compiles
        run: cargo test -p kite-driver --test site_examples

  wasm:
    name: the compiler builds for the web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p kite-playground --target wasm32-unknown-unknown
