[workspace]
resolver = "2"
members = [
    "crates/kite-span",
    "crates/kite-diag",
    "crates/kite-lexer",
    "crates/kite-fmt",
    "crates/kite-doc",
    "crates/kite-ast",
    "crates/kite-parser",
    "crates/kite-resolve",
    "crates/kite-types",
    "crates/kite-hir",
    "crates/kite-mir",
    "crates/kite-codegen-kbc",
    "crates/kite-codegen-wasm",
    "crates/kite-codegen-clif",
    "crates/kite-rt",
    "crates/kite-vm",
    "crates/kite-driver",
    "crates/kite-lsp",
    "crates/kite-playground",
    "bin/kitec",
]

[workspace.package]
version = "0.1.5"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/channyeintun/kite-lang"

[workspace.dependencies]
kite-span = { path = "crates/kite-span" }
kite-diag = { path = "crates/kite-diag" }
kite-lexer = { path = "crates/kite-lexer" }
kite-fmt = { path = "crates/kite-fmt" }
kite-doc = { path = "crates/kite-doc" }
kite-ast = { path = "crates/kite-ast" }
kite-parser = { path = "crates/kite-parser" }
kite-resolve = { path = "crates/kite-resolve" }
kite-types = { path = "crates/kite-types" }
kite-hir = { path = "crates/kite-hir" }
kite-mir = { path = "crates/kite-mir" }
kite-codegen-kbc = { path = "crates/kite-codegen-kbc" }
kite-codegen-wasm = { path = "crates/kite-codegen-wasm" }
kite-codegen-clif = { path = "crates/kite-codegen-clif" }
kite-rt = { path = "crates/kite-rt" }
kite-vm = { path = "crates/kite-vm" }
kite-driver = { path = "crates/kite-driver" }
# The native backend's code generator. One version pinned across all five so
# the IR a frontend builds is the IR the module and JIT crates expect.
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-module = "0.134"
cranelift-jit = "0.134"
cranelift-object = "0.134"
cranelift-native = "0.134"

[profile.release]
opt-level = 3
lto = "thin"
