# The examples are a package only so that they can depend on one.
#
# `std/ui` is a layout engine with no widgets in it: a button is not something
# the core knows about, because what a button looks like is a design system's
# answer rather than a language's. The examples that need controls therefore
# reach for a design system the same way any program would.
[package]
name = "examples"
version = "0.1.0"

[dependencies]
material = { path = "../packages/material" }
