<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five thousand rows</title>
<link rel="stylesheet" href="style.css">

<main class="panel">
  <header>
    <h1>Ledger</h1>
    <input id="search" class="search" type="search" placeholder="Filter by name, city or status" autocomplete="off">
  </header>

  <table>
    <thead>
      <tr>
        <th data-key="id" class="num">#</th>
        <th data-key="name">Name</th>
        <th data-key="region">City</th>
        <th data-key="amount" class="num">Amount</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <p id="note" class="note"></p>
</main>

<script type="module">
  import { instantiate, resident } from "./app.js";
  const exports = await instantiate("./app.wasm");
  // Resident first, so the program's own clock is the real one from its first
  // line rather than from its first event.
  resident(exports);
  exports.main();
</script>
