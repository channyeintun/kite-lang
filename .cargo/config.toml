# Frame pointers, everywhere, because the collector needs them.
#
# `kite-rt` finds GC roots by walking the frame-pointer chain from inside the
# runtime up to the compiled program's entry. Cranelift is told to keep frame
# pointers in the code it emits, but the frames *between* — this crate's own,
# on the way from the allocator to the Kite frame that called it — are Rust,
# and Rust omits frame pointers by default on x86-64 Linux and Windows. There
# `rbp` is an ordinary callee-saved register, and a walk that reads it as a
# frame record reads whatever the optimiser happened to leave there.
#
# That is not a performance knob with a correctness footnote; it is the other
# way round. A precise collector that moves objects has to find every
# reference, and a chain it cannot follow is a reference it will not update.
# Apple targets require frame pointers by ABI, which is why the first version
# of the walk passed on macOS and corrupted the heap on the other two.
#
# The cost is one register on x86-64 and nothing on AArch64. For a compiler
# that is not a trade worth thinking about twice.
#
# Anyone building `kite-rt` into their own binary needs the same flag. The
# walk is bounded and validated so a broken chain loses a root rather than
# scribbling on the heap — but a lost root is a use-after-free, so this is a
# requirement rather than an optimisation.
#
# Which is why `crates/kite-rt/build.rs` refuses to build without it on the
# targets where it is not implied by the ABI. This file is not the guarantee —
# a `RUSTFLAGS` in the environment replaces these flags rather than adding to
# them, and that is how the release workflow shipped binaries without it.
[build]
rustflags = ["-C", "force-frame-pointers=yes"]

# The compiler built for WebAssembly — `kite-playground`, which is the
# playground and `@kite-lang/compiler-wasm` — gets a 16 MiB stack instead of
# wasm-ld's 1 MiB default.
#
# The parser and the checker recurse, and 1 MiB ran out at five to eight
# hundred string literals joined with `+`, which the native compiler handles
# at a thousand. It ran out as `memory access out of bounds` rather than as a
# diagnostic, and the instance it happened in was broken for every call after
# it — one such file took down a Vite dev server until it was restarted. The
# parser has since learned to refuse a chain past 1,024 links in this build
# (E0102), so that input is a diagnostic now. With 16 MiB here, what runs out
# first is the JavaScript engine's own stack, which a wasm call also runs on
# and nothing in the module can enlarge: in Node about 1,900 links of `+`
# exhausted it, which is what that ceiling is set by. The stack is linear
# memory the instance reserves, not bytes in the module.
#
# A target's `rustflags` *replace* `[build] rustflags` rather than adding to
# them, so the frame-pointer flag above is repeated here. No Wasm frame walk
# needs it, but a rule that quietly stopped applying to one target is the kind
# of thing the comment at the top of this file warns about.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "force-frame-pointers=yes", "-C", "link-arg=-zstack-size=16777216"]
