<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference — Kite</title>
<link rel="stylesheet" href="kite.css">
</head>
<body>
<header>
  <span class="name">Kite</span>
  <nav>
    <a href="index.html">Home</a>
    <a href="docs.html?doc=SPECIFICATION.md">Specification</a>
    <a href="reference.html">Reference</a>
    <a href="playground.html">Playground</a>
  </nav>
</header>

<main>
  <h1>Standard library</h1>
  <p class="lede">
    Generated by <code>kitec doc</code> from the library's own source. The
    standard library is written in Kite, so its documentation and yours are
    produced by the same tool — which is the only arrangement in which the two
    stay comparable.
  </p>
  <nav id="modules" class="samples"></nav>
  <div id="content"><p class="muted">Loading…</p></div>
</main>

<script type="module">
import { markdown } from "./kite.js";

const MODULES = ["prelude", "task", "math", "time", "errors", "fmt", "json", "test", "buffer", "http", "crypto", "ui"];
const nav = document.getElementById("modules");
const content = document.getElementById("content");

const show = (name) => {
  history.replaceState(null, "", `?module=${name}`);
  fetch(`reference/${name}.md`)
    .then((r) => (r.ok ? r.text() : Promise.reject(new Error(`${r.status}`))))
    .then((text) => {
      content.innerHTML = markdown(text);
    })
    .catch((e) => {
      content.innerHTML = `<p>Could not load <code>${name}</code> (${e.message}). Run <code>site/build.sh</code> to generate the reference.</p>`;
    });
};

for (const name of MODULES) {
  const button = document.createElement("button");
  button.textContent = name;
  button.onclick = () => show(name);
  nav.appendChild(button);
}
show(new URLSearchParams(location.search).get("module") ?? "prelude");
</script>
</body>
</html>
