<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kite</title>
<!-- These pages are rendered at build time now and live under `read/` and
     `reference/`. This is here because a link somebody already has is a
     promise: `?doc=` and `?module=` are translated rather than broken. -->
<script>
const p = new URLSearchParams(location.search);
const doc = p.get("doc"), mod = p.get("module");
const slug = (d) => d.split("/").pop().replace(/\.md$/, "").toLowerCase();
location.replace(doc ? "read/" + slug(doc) + ".html"
  : mod ? "reference/" + mod + ".html"
  : "read/specification.html");
</script>
</head>
<body></body>
</html>
