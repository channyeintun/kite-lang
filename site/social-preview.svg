<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"
     role="img" aria-label="Kite — a small, explicit language for building application software">
  <!--
    The repository's social preview, at the 1280 x 640 the sheet specifies.

    SVG rather than a rasteriser: the size is exact by construction, the text
    stays selectable and searchable, and there is no build step between the
    brand sheet and the artefact. Surfaces that show this card crop it
    slightly, so nothing load-bearing enters the outer 40 px.

    The three commitments are pulled from the README rather than written here.
    Swap them per release; do not write new copy for the card.
  -->
  <rect width="1280" height="640" fill="#161826"/>

  <!-- The mark, at 108 on this canvas: the lockup's proportion, doubled with
       the card. -->
  <g transform="translate(96, 88) scale(1.08)">
    <polygon points="44,7 64,34 44,76 24,34" transform="rotate(-12 44 40)"
             fill="#e9a63c" stroke="#e9a63c" stroke-width="6" stroke-linejoin="round"/>
    <path d="M59 78 L63.5 83 L59 88 L54.5 83 Z M70 85 L73.6 89 L70 93 L66.4 89 Z"
          fill="#e9a63c" stroke="#e9a63c" stroke-width="4.5" stroke-linejoin="round"/>
  </g>

  <text x="212" y="168" fill="#e9e9ed" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="80" font-weight="500" letter-spacing="-1.6">Kite</text>

  <text x="96" y="452" fill="#e9e9ed" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
        font-size="46" letter-spacing="-0.46">A small, explicit language for</text>
  <text x="96" y="508" fill="#e9e9ed" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
        font-size="46" letter-spacing="-0.46">building application software.</text>

  <!--
    The commitments flow as one run of text. SVG lays out no text, so drawn
    separators at fixed positions land wherever the font happens to end — which
    is mid-word on any machine without the exact font. A separator that is part
    of the run cannot land anywhere else.
  -->
  <text x="96" y="574" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="26" fill="#8b8d9e"><tspan fill="#e9a63c">27 keywords</tspan><tspan
        fill-opacity="0.45">  ·  </tspan>no hidden control flow<tspan
        fill-opacity="0.45">  ·  </tspan>WasmGC first</text>
</svg>
