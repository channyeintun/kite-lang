# The suite in this directory is a package only so that it can depend on one.
#
# `material` is not part of the standard library and is not reachable by a `use`
# that names it unless something says where it lives — which is the whole point
# of it being a package. This manifest is that.
[package]
name = "package-tests"
version = "0.1.0"

[dependencies]
material = { path = "../../packages/material" }
